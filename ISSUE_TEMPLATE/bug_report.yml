name: Bug report
description: Something in Emaki does not work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting. A security problem never goes here: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      placeholder: |
        1. Open …
        2. Click …
        3. See …
  - type: input
    id: version
    attributes:
      label: Emaki version
      description: Settings › About
      placeholder: "0.9.0"
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Computer
      description: Make and model, or at least the graphics card and Wi-Fi chip.
      placeholder: "ThinkPad T14 Gen 5, AMD"
  - type: textarea
    id: report
    attributes:
      label: Report
      description: Open the **Report a problem** app and attach the report it makes, or paste it here.
